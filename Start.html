
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: black;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            animation: fade-up 10s;
        }

        @keyframes fade-up {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }

            100% {
                opacity: 1;
                transform: translateY(0px);
            }
        }

        @keyframes logoFade {
            0% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes logoup {
            0% {
                top: -25px;
            }

            100% {
                top: -50px;
            }
        }

        @keyframes logozoom {
            0% {
                transform: scale(0.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .pseudo-btn:hover {
            scale: 1.1;
            filter: drop-shadow(0 0 15px #7777FF);
            translate: 0 -5px;
        }

        .pseudo-btn::before,
        .pseudo-btn::after {
            content: "";
            position: absolute;
            inset: 5%;
            border: 2px solid #7777FF;
            border-radius: 50%;
            box-shadow:
                0 0 12px #7777FF,
                0 0 30px #7777FF,
                0 0 50px #7777FF,
                inset 0 0 12px #7777FF;
            opacity: 0;
            pointer-events: none;
        }

        #start:checked ~ .intro-screen .pseudo-btn::before {
            animation: neonEcho 0.9s ease-out infinite;
        }

        #start:checked ~ .intro-screen .pseudo-btn::after {
            animation: neonEcho 0.9s ease-out 0.22s infinite;
        }

        @keyframes neonEcho {
            0% {
                transform: scale(0.75);
                opacity: 1;
            }

            20% {
                opacity: 0.85;
            }

            100% {
                transform: scale(1.8);
                opacity: 0;
            }
        }


        @keyframes impactShake {
            0% {
                translate: 0 0;
                rotate: 0deg;
            }

            12% {
                translate: -8px 4px;
                rotate: -1deg;
            }

            25% {
                translate: 8px -4px;
                rotate: 1deg;
            }

            38% {
                translate: -7px 3px;
                rotate: -1.5deg;
            }

            52% {
                translate: 6px -2px;
                rotate: 1.2deg;
            }

            66% {
                translate: -4px 2px;
                rotate: -0.8deg;
            }

            82% {
                translate: 3px -1px;
                rotate: 0.5deg;
            }

            100% {
                translate: 0 0;
                rotate: 0deg;
            }
        }


        @keyframes clickPop {
            0% {
                scale: 1;
            }

            30% {
                scale: 1.25;
            }

            60% {
                scale: 1.12;
            }

            100% {
                scale: 1;
            }
        }

        #start:checked ~ .intro-screen .pseudo-btn {
            filter: drop-shadow(0 0 30px #7777FF);

            animation-name:
                logoFade,
                logoup,
                logozoom,
                impactShake,
                clickPop;

            animation-duration:
                9s,
                1s,
                1.5s,
                0.30s,
                0.40s;

            animation-timing-function:
                ease,
                ease,
                ease,
                cubic-bezier(0.36, 0.07, 0.19, 0.97),
                ease-out;

            animation-delay:
                0s,
                0s,
                0.5s,
                0s,
                0s;

            animation-iteration-count:
                1,
                1,
                1,
                1,
                1;

            animation-fill-mode:
                forwards,
                forwards,
                forwards,
                both,
                both;
        }


        @keyframes contentglow {
            0%, 100% {
                filter: drop-shadow(0 0 0px transparent);
            }

            50% {
           filter:
               drop-shadow(0 0 3px #FFFFFF)
               drop-shadow(0 0 3px #FFFFFF);
            }
        }


        .halftone {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;

            background-image:
                radial-gradient(circle, #3D3D90 1.5px, transparent 2px);

            background-size: 12px 12px;

            mask-image:
                radial-gradient(circle at top left, black, transparent 35%),
                radial-gradient(circle at top right, black, transparent 35%),
                radial-gradient(circle at bottom left, black, transparent 35%),
                radial-gradient(circle at bottom right, black, transparent 35%);

            mask-composite: add;

            animation:
                halftoneMove 8s ease-in-out infinite alternate,
                fade-up 10s forwards;
        }

        @keyframes halftoneMove {
            0% {
                background-position: 0px 0px;
            }

            100% {
                background-position: 24px 24px;
            }
        }

        .halftone::after {
            content: "";
            position: absolute;
            inset: 0;

            background-image:
                radial-gradient(circle, #7777FF 2.5px, transparent 3px),
                radial-gradient(circle, #3D3D90 2px, transparent 2.5px),
                radial-gradient(circle, #7777FF 3px, transparent 3.5px),
                radial-gradient(circle, #3D3D90 2.5px, transparent 3px);

            background-size:
                120px 120px,
                180px 180px,
                240px 240px,
                150px 150px;

            background-position:
                20px 30px,
                80px 50px,
                120px 100px,
                40px 90px;

            animation: tw 4s ease-in-out infinite alternate;
        }

        @keyframes tw {
            0% {
                opacity: 0.1;
                transform: scale(0.98);
            }

            50% {
                opacity: 0.7;
                transform: scale(1.02);
            }

            100% {
                opacity: 0.2;
                transform: scale(1);
            }
        }


        #start {
            display: none;
        }


        .intro-screen {
        position: fixed;
        inset: 0;
        z-index: 1;
        isolation: isolate;
        background: black;

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        transition:
        opacity 0.8s ease 0.45s,
        visibility 0s linear 1.25s;
        }

        #start:checked ~ .intro-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }


        .pseudo-btn {
            display: block;
            width: 500px;
            height: 500px;
            padding: 0;
            border: none;
            background: url("LOGO.webp") center / contain no-repeat;
            cursor: pointer;
            position: relative;
            z-index: 1;
            top: 100px;
            transform: scale(0.2);

            transition:
                scale 0.8s cubic-bezier(0.22, 1, 0.36, 1),
                filter 0.8s ease,
                translate 0.8s ease;

            animation:
                logoFade 9s ease forwards,
                logoup 1s ease forwards,
                logozoom 1.5s ease 0.5s forwards;
        }

        .content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            top: -95px;

            animation:
                logoFade 9s ease forwards,
                logoup 1s ease forwards,
                contentglow 2s ease-in-out infinite;
        }

        .transition-screen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;

            overflow: hidden;
            background: #050510;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 1.2s ease 0.45s,
                visibility 0s linear 1.65s;
        }


        #start:checked ~ .transition-screen {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;

            transition:
                opacity 1.2s ease 0.45s,
                visibility 0s;
        }


        .video-bg2-blur {
            position: absolute;
            top: -25px;
            left: -25px;
            width: calc(100% + 50px);
            height: calc(100% + 50px);

            object-fit: cover;

            filter:
                blur(25px)
                brightness(0.45)
                saturate(1.3);

            transform: scale(1.08);

            opacity: 0;
            z-index: 0;

            transition: opacity 1.4s ease 0.45s;
        }

        #start:checked ~ .transition-screen .video-bg2-blur {
            opacity: 1;
        }


        .transition-screen::after {
            content: "";
            position: absolute;
            inset: 0;

            background: rgba(5, 5, 20, 0.3);

            opacity: 0;
            z-index: 1;
            pointer-events: none;

            transition: opacity 1.2s ease 0.45s;
        }

        #start:checked ~ .transition-screen::after {
            opacity: 1;
        }


        .video-bg2 {
            position: relative;
            z-index: 2;

            display: block;

            width: min(82vw, 950px);
            height: min(55vh, 540px);

            object-fit: cover;

            border-radius: 10px;

            -webkit-mask-image: radial-gradient(
                ellipse 75% 85% at center,
                black 55%,
                rgba(0, 0, 0, 0.9) 70%,
                transparent 100%
            );

            mask-image: radial-gradient(
                ellipse 75% 85% at center,
                black 55%,
                rgba(0, 0, 0, 0.9) 70%,
                transparent 100%
            );

            box-shadow:
                0 0 20px rgba(119, 119, 255, 0.2),
                0 0 50px rgba(119, 119, 255, 0.15);

            opacity: 0;
            transform: scale(0.95);

            transition:
                opacity 1.2s ease 0.45s,
                transform 1.2s ease 0.45s;
        }

        #start:checked ~ .transition-screen .video-bg2 {
            opacity: 1;
            transform: scale(1);
        }


        .transition-content {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 3;

            width: 100%;

            color: white;
            text-align: center;

            opacity: 0;
            transform: translate(-50%, -50%) translateY(20px);

            transition:
                opacity 0.8s ease 1.5s,
                transform 0.8s ease 1.5s;
        }

        #start:checked ~ .transition-screen .transition-content {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        .transition-content h1 {
            letter-spacing: 5px;
            font-size: 30px;
            margin-bottom: 25px;
        }


        .next-btn {
            display: inline-block;

            color: white;
            text-decoration: none;

            padding: 15px 40px;

            border: 1px solid #7777FF;
            background: rgba(20, 20, 50, 0.3);

            letter-spacing: 3px;

            transition:
                scale 0.5s ease,
                box-shadow 0.5s ease,
                background 0.5s ease;
        }

        .next-btn:hover {
            scale: 1.1;

            background: rgba(119, 119, 255, 0.15);

            box-shadow:
                0 0 12px #7777FF,
                0 0 30px #7777FF;
				
			animation:
			contentglow 2s ease-in-out infinite;
        }

    </style>
</head>

<body>


    <input type="checkbox" id="start">


    <div class="intro-screen">

        <video class="video-bg" src="htmlBGMain.mp4" autoplay muted loop playsinline></video>

        <div class="halftone"></div>

        <label for="start" class="pseudo-btn" aria-label="Start"></label>

        <div class="content">
            <h1>PORTFOLIO</h1>
            <p>Test</p>
        </div>

    </div>



    <div class="transition-screen">


        <video class="video-bg2-blur" src="htmlBGMain.mp4" autoplay muted loop playsinline></video>


        <video class="video-bg2" src="BGMain2.mp4" autoplay muted loop playsinline></video>

        <div class="transition-content">

            <h1 class="content">WELCOME</h1>

            <a href="./Menu.html" class="next-btn"> <b>
                ENTER </b>
            </a>

        </div>

    </div>

</body>
</html>
